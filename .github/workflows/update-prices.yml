name: Update Apple price data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]>=0.4.14"
          scrapling install --force

      - name: Scrape Digicape
        continue-on-error: true
        run: python scripts/digicape_prices.py --no-accessories

      - name: Scrape iStore
        continue-on-error: true
        run: python scripts/istore_prices.py

      - name: Scrape Takealot
        continue-on-error: true
        run: python scripts/takealot_apple_prices.py

      - name: Scrape Incredible Connection
        # Previously missing entirely -- data/incredible.json had been a
        # frozen, hand-curated snapshot with no automated refresh, even
        # though combine.py actively uses it for matching.
        continue-on-error: true
        run: python scripts/incredible_prices.py

      - name: Scrape Digicape Mac configurations
        continue-on-error: true
        run: python scripts/digicape_mac_configs.py

      - name: Combine into data/prices.json
        run: python scripts/combine.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update price data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # The scrape steps above can take several minutes; if another
            # commit lands on main in the meantime (e.g. manual pushes during
            # development -- this happened live on 2026-08-19), a plain
            # 'git push' correctly refuses with "fetch first" rather than
            # overwriting. This job always fully regenerates every file
            # under data/, so on a conflict prefer this run's freshly-scraped
            # data over whatever raced ahead of it, while still merging in
            # any unrelated commits (script/README/workflow changes) cleanly.
            git fetch origin main
            git merge origin/main -X ours -m "Merge scheduled data update onto latest main"
            git push
          fi
