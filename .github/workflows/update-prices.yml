name: Update Apple price data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]>=0.4.14"
          scrapling install --force

      - name: Scrape Digicape
        continue-on-error: true
        run: python scripts/digicape_prices.py --no-accessories

      - name: Scrape iStore
        continue-on-error: true
        run: python scripts/istore_prices.py

      - name: Scrape Takealot
        continue-on-error: true
        run: python scripts/takealot_apple_prices.py

      - name: Scrape Digicape Mac configurations
        continue-on-error: true
        run: python scripts/digicape_mac_configs.py

      - name: Combine into data/prices.json
        run: python scripts/combine.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update price data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
